name: migrations-check

# Validates that backend/migrations/*.sql apply cleanly to a fresh
# Postgres instance. Runs only on PRs that touch the migrations
# directory or the runner itself; prevents the "we forgot to apply
# 002 in production" class of incident.

on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "backend/ops/**"
      - "backend/tests/apply_migrations.test.mjs"
      - "backend/tests/initialize_empty_auth_store.test.mjs"
      - "backend/render.yaml"
      - "scripts/apply_migrations.mjs"
      - "backend/lib/persistence_postgres.js"
      - "backend/lib/persistence_adapter.js"
      - "backend/tests/persistence_adapter.test.mjs"
      - "backend/tests/persistence_postgres_live.test.mjs"
      - ".github/workflows/migrations-check.yml"
  push:
    branches:
      - main
    paths:
      - "backend/migrations/**"
      - "backend/ops/**"
      - "backend/tests/apply_migrations.test.mjs"
      - "backend/tests/initialize_empty_auth_store.test.mjs"
      - "backend/render.yaml"
      - "scripts/apply_migrations.mjs"
      - "backend/lib/persistence_postgres.js"
      - "backend/lib/persistence_adapter.js"
      - "backend/tests/persistence_adapter.test.mjs"
      - "backend/tests/persistence_postgres_live.test.mjs"
      - ".github/workflows/migrations-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply migrations to fresh Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: them_migrations_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/them_migrations_check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test migration and empty-auth release boundaries
        run: >-
          node --test
          backend/tests/apply_migrations.test.mjs
          backend/tests/initialize_empty_auth_store.test.mjs
          backend/tests/render_blueprint_contract.test.mjs

      - name: Status (should list every migration as PENDING)
        run: |
          set -e
          out=$(node scripts/apply_migrations.mjs --status)
          echo "$out"
          if ! grep -q PENDING <<<"$out"; then
            echo "::error::expected at least one PENDING migration on a fresh DB"
            exit 1
          fi

      - name: Apply migrations with the in-image runner
        run: node backend/ops/apply_migrations.mjs

      - name: Status (should report 0 pending)
        run: |
          set -e
          out=$(node scripts/apply_migrations.mjs --status)
          echo "$out"
          if grep -q PENDING <<<"$out"; then
            echo "::error::migrations still pending after apply"
            exit 1
          fi

      - name: Re-apply in-image runner is a no-op
        run: |
          set -e
          out=$(node backend/ops/apply_migrations.mjs)
          echo "$out"
          if grep -Eq "applied this run:[[:space:]]*0" <<<"$out"; then
            echo "ok — idempotent"
          else
            echo "::error::re-applying migrations was not a no-op"
            exit 1
          fi

      - name: Confirm and initialize a provably empty auth store
        env:
          AUTH_STORE_EMPTY_INIT_CONFIRMATION: initialize-empty-canonical-auth-store-v1
        run: node backend/ops/render_predeploy.mjs

      - name: Initialized auth store no-ops without confirmation
        run: node backend/ops/render_predeploy.mjs

      - name: Verify literal prefix queries against Postgres
        run: node --test backend/tests/persistence_postgres_live.test.mjs
