name: migrations-check

# Validates that backend/migrations/*.sql apply cleanly to a fresh
# Postgres instance. Runs only on PRs that touch the migrations
# directory or the runner itself; prevents the "we forgot to apply
# 002 in production" class of incident.

on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "scripts/apply_migrations.mjs"
      - "backend/lib/persistence_postgres.js"
      - "backend/lib/persistence_adapter.js"
      - ".github/workflows/migrations-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply migrations to fresh Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: them_migrations_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/them_migrations_check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Status (should list every migration as PENDING)
        run: |
          set -e
          out=$(node scripts/apply_migrations.mjs --status)
          echo "$out"
          if ! grep -q PENDING <<<"$out"; then
            echo "::error::expected at least one PENDING migration on a fresh DB"
            exit 1
          fi

      - name: Apply migrations
        run: node scripts/apply_migrations.mjs

      - name: Status (should report 0 pending)
        run: |
          set -e
          out=$(node scripts/apply_migrations.mjs --status)
          echo "$out"
          if grep -q PENDING <<<"$out"; then
            echo "::error::migrations still pending after apply"
            exit 1
          fi

      - name: Re-apply is a no-op
        run: |
          set -e
          out=$(node scripts/apply_migrations.mjs)
          echo "$out"
          if echo "$out" | grep -q "applied this run: 0"; then
            echo "ok — idempotent"
          else
            echo "::error::re-applying migrations was not a no-op"
            exit 1
          fi
