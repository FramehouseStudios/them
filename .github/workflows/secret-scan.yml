# Muse audit 2026-09-05 §5: no secret scanning in CI. gitleaks runs on every
# push and pull request over the full history so a leaked key cannot merge
# even if it was added and removed within one PR. A `.gitleaks.toml` at the
# repo root can allowlist the synthetic fixtures under backend/tests if the
# default rules ever flag them.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
