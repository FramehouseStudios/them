# Muse audit 2026-09-05 §5: no SAST. CodeQL for the JavaScript backend on
# pushes to main, pull requests, and a weekly schedule. Swift is not scanned
# here on purpose: the Swift extractor needs a full Xcode build on a macOS
# runner (~10x minute cost) and the quality gate already builds the app;
# add it as a separate job once the macOS minute budget is settled.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
