name: page-craft-eval

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  page-craft-heuristic:
    name: Page craft eval (heuristic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run heuristic page craft eval
        working-directory: backend
        run: npm run eval:page-craft
      - name: Unit tests for page craft scorer
        working-directory: backend
        run: node --test tests/page_craft_eval.test.mjs
