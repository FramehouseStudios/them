name: Mentor golden set

# Weekly runs are offline exemplars only, without provider credentials.
# Live measurement requires a fresh, explicit manual approval for its scope.
# Do not automatically retry live provider failures or spend credits on cron.

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:
    inputs:
      live_approved:
        description: "I authorize this one paid live measurement for the selected scope (blank scope = all 40 cases)"
        type: boolean
        required: true
        default: false
      only:
        description: "Limit to one case id or category (pitch, build, structure, dialogue, register)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mentor-golden-live
  cancel-in-progress: false

jobs:
  offline:
    name: Offline exemplars and prompt contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Offline gate (not live model output)
        working-directory: backend
        env:
          MENTOR_GOLDEN_REPORT: ${{ github.workspace }}/mentor-golden/offline-report.json
        run: npm run eval:mentor-golden
      - name: Upload offline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentor-golden-offline-report
          path: mentor-golden/offline-report.json
          if-no-files-found: ignore
          retention-days: 90
  live:
    name: Explicitly approved live measurement
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.live_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Live measurement
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MENTOR_GOLDEN_LIVE_APPROVED: "1"
          MENTOR_GOLDEN_REPORT: ${{ github.workspace }}/mentor-golden/report.json
          CHAT_MODEL_RICH: ${{ vars.CHAT_MODEL_RICH || 'gpt-4o' }}
          MENTOR_GOLDEN_ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$MENTOR_GOLDEN_ONLY" ]; then
            node evals/run_mentor_golden_eval.mjs --live --only="$MENTOR_GOLDEN_ONLY"
          else
            npm run eval:mentor-golden:live
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentor-golden-live-report
          path: mentor-golden/report.json
          if-no-files-found: ignore
          retention-days: 90
