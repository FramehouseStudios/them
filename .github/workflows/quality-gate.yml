name: quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_eval:
        description: Run prompt regression eval
        required: false
        type: boolean
        default: true
      run_canon:
        description: Run canon umbrella (npm run eval:canon)
        required: false
        type: boolean
        default: true
      run_speculative_reuse_gate:
        description: Run speculative /talk prepare-reuse smoke
        required: false
        type: boolean
        default: true
      run_smoke:
        description: Run smoke.sh coverage
        required: false
        type: boolean
        default: true
      run_talk_recovery_gate:
        description: Run talk recovery contract gate
        required: false
        type: boolean
        default: true
      run_alert:
        description: Run ops alert checks
        required: false
        type: boolean
        default: true
      run_load:
        description: Run load profile
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_eval:
        required: false
        type: boolean
        default: true
      run_canon:
        required: false
        type: boolean
        default: true
      run_speculative_reuse_gate:
        required: false
        type: boolean
        default: true
      run_smoke:
        required: false
        type: boolean
        default: true
      run_talk_recovery_gate:
        required: false
        type: boolean
        default: true
      run_alert:
        required: false
        type: boolean
        default: true
      run_load:
        required: false
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false
      APP_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  god-file-gate:
    name: God-file gate (D009)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check god-file growth vs base
        run: node scripts/check_god_files.mjs

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run complete backend test suite
        working-directory: backend
        run: npm test

  quality-gate:
    name: Quality Gate
    runs-on: macos-latest
    # Measured 2026-09-02/03: repo gate ~10 s, required writer loop 490–590 s,
    # required unit bundle (themTests, added 2026-09-06) build + ~600 tests,
    # soft UI smoke 750–1000 s, voice smokes 170–260 s, plus setup — about
    # 35 min end to end. Without this cap a wedged simulator holds the
    # required check for the 6-hour default.
    timeout-minutes: 75
    env:
      RUN_SERVER: 1
      RUN_EVAL: ${{ github.event_name == 'pull_request' && '0' || (inputs.run_eval && '1' || '0') }}
      RUN_CANON: ${{ github.event_name == 'pull_request' && '1' || (inputs.run_canon && '1' || '0') }}
      RUN_SPECULATIVE_REUSE_GATE: ${{ github.event_name == 'pull_request' && '0' || (inputs.run_speculative_reuse_gate && '1' || '0') }}
      RUN_SMOKE: ${{ github.event_name == 'pull_request' && '0' || (inputs.run_smoke && '1' || '0') }}
      RUN_TALK_RECOVERY_GATE: ${{ github.event_name == 'pull_request' && '0' || (inputs.run_talk_recovery_gate && '1' || '0') }}
      RUN_ALERT: ${{ github.event_name == 'pull_request' && '0' || (inputs.run_alert && '1' || '0') }}
      RUN_LOAD: ${{ github.event_name == 'pull_request' && '0' || (inputs.run_load && '1' || '0') }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          missing=()
          if [[ "${RUN_EVAL}" == "1" || "${RUN_TALK_RECOVERY_GATE}" == "1" ]]; then
            if [[ -z "${OPENAI_API_KEY:-}" ]]; then
              missing+=("OPENAI_API_KEY")
            fi
          fi
          if [[ "${RUN_SPECULATIVE_REUSE_GATE}" == "1" || "${RUN_SMOKE}" == "1" || "${RUN_ALERT}" == "1" ]]; then
            if [[ -z "${APP_TOKEN:-}" ]]; then
              missing+=("APP_TOKEN")
            fi
          fi
          if (( ${#missing[@]} > 0 )); then
            {
              echo "## Quality Gate Summary"
              echo
              echo "- Trigger: ${{ github.event_name }}"
              echo "- Status: failed before gate execution"
              echo "- Missing required secrets: ${missing[*]}"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # See docs/ci-openai-secret-fix.md for context on issue #33.
      # This step turns malformed-secret failures into a one-line gate
      # error instead of a cryptic 401 deep inside eval:gate.
      - name: Validate OPENAI_API_KEY format
        if: env.OPENAI_API_KEY != ''
        run: |
          set -eo pipefail
          if [[ "${OPENAI_API_KEY}" =~ [[:space:]] ]]; then
            echo "::error::OPENAI_API_KEY contains whitespace; rotate per docs/ci-openai-secret-fix.md"
            exit 1
          fi
          code=$(curl -sS -o /tmp/openai-validate.json -w "%{http_code}" \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer ${OPENAI_API_KEY}")
          if [[ "${code}" != "200" ]]; then
            echo "::error::OPENAI_API_KEY rejected by api.openai.com (HTTP ${code})"
            head -c 400 /tmp/openai-validate.json || true
            echo
            echo "See docs/ci-openai-secret-fix.md for rotation steps."
            exit 1
          fi
          echo "OPENAI_API_KEY validated OK"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run repo quality gate
        run: bash ./scripts/quality_gate.sh

      # The unit bundle runs before the writer loop so a red unit test fails the
      # gate in ~10 min instead of after the 8-10 min UI story, and its build
      # warms the derived data the writer loop then reuses.
      - name: Run iOS unit bundle themTests (required)
        run: scripts/run_ios_unit_tests.sh

      - name: Run integrated iPhone writer loop (required)
        working-directory: backend
        run: npm run eval:studio-ios-writer-loop-contract

      - name: Run iOS V1 UI smoke tests (soft gate)
        continue-on-error: true
        run: scripts/run_v1_ui_smoke.sh

      - name: Run iPhone and macOS voice network-fault smokes (soft gate)
        continue-on-error: true
        run: scripts/run_voice_network_fault_smokes.sh

      - name: Workflow inputs summary
        if: always()
        run: |
          gate_status() {
            if [[ "$1" == "1" ]]; then
              echo "enforced"
            else
              echo "skipped"
            fi
          }
          {
            echo "## Quality Gate Summary"
            echo
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Canon umbrella: $(gate_status "${RUN_CANON}")"
            echo "- Prompt regression: $(gate_status "${RUN_EVAL}")"
            echo "- Speculative reuse smoke: $(gate_status "${RUN_SPECULATIVE_REUSE_GATE}")"
            echo "- Smoke suite: $(gate_status "${RUN_SMOKE}")"
            echo "- Talk recovery gate: $(gate_status "${RUN_TALK_RECOVERY_GATE}")"
            echo "- Ops alerts: $(gate_status "${RUN_ALERT}")"
            echo "- Load profile: $(gate_status "${RUN_LOAD}")"
            echo "- iOS unit bundle: required (themTests)"
            echo "- Integrated iPhone writer loop: required"
            echo "- iOS V1 UI smoke: soft gate (themUITests)"
            echo "- Voice network faults: soft gate (iPhone + macOS themUITests)"
            echo "- Default secrets for this workflow shape: \`OPENAI_API_KEY\`, \`APP_TOKEN\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-failure-logs
          if-no-files-found: ignore
          path: |
            /tmp/them-quality-gate-backend.log
            /tmp/them-smoke/them-home.png
