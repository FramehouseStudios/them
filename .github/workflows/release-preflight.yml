name: release-preflight

on:
  push:
    tags:
      - "rc-*"
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true
      APP_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: macos-latest
    env:
      RUN_QUALITY_GATE: 1
      RUN_SERVER: 1
      RUN_EVAL: 1
      RUN_SPECULATIVE_REUSE_GATE: 1
      RUN_SMOKE: 1
      RUN_TALK_RECOVERY_GATE: 1
      RUN_ALERT: 1
      RUN_LOAD: 0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          missing=()
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            missing+=("OPENAI_API_KEY")
          fi
          if [[ -z "${APP_TOKEN:-}" ]]; then
            missing+=("APP_TOKEN")
          fi
          if (( ${#missing[@]} > 0 )); then
            {
              echo "## Release Preflight Summary"
              echo
              echo "- Trigger: ${{ github.event_name }}"
              echo "- Ref: ${{ github.ref }}"
              echo "- Status: failed before preflight execution"
              echo "- Missing required secrets: ${missing[*]}"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Ensure gate scripts are executable
        run: chmod +x ./scripts/quality_gate.sh ./scripts/appstore_preflight.sh ./scripts/desktop_preflight.sh

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run Release Preflight With Quality Gate
        run: bash ./scripts/appstore_preflight.sh

      - name: Verify Clementine Studio Writer Block Rescue
        working-directory: backend
        run: npm run eval:studio-instinct-writer-block-ui

      - name: Upload Clementine Studio Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clementine-studio-writer-block-evidence
          if-no-files-found: warn
          retention-days: 14
          path: /tmp/them-smoke/studio-instinct-writer-block/

      - name: Run Mac Desktop Preflight
        env:
          MAC_DESKTOP_CONFIGURATION: Mac Scaffold Release
          MAC_DESKTOP_ACTION: archive
        run: bash ./scripts/desktop_preflight.sh

      - name: Verify Quality Gate Was Enforced
        run: |
          if [[ "${RUN_QUALITY_GATE:-}" != "1" ]]; then
            {
              echo "::error::RUN_QUALITY_GATE=${RUN_QUALITY_GATE:-unset}. Release preflight requires the quality gate to be enforced. The workflow's env: block must keep RUN_QUALITY_GATE=1 for every release-candidate run."
              echo
              echo "## Release Preflight Summary"
              echo
              echo "- Status: failed — quality gate was not enforced"
              echo "- RUN_QUALITY_GATE: ${RUN_QUALITY_GATE:-unset}"
              echo "- Required: 1"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ ! -s /tmp/them-quality-gate-backend.log ]]; then
            {
              echo "::error::Expected quality gate evidence at /tmp/them-quality-gate-backend.log was not produced or is empty. The gate may have been skipped despite RUN_QUALITY_GATE=1."
              echo
              echo "## Release Preflight Summary"
              echo
              echo "- Status: failed — quality gate evidence missing"
              echo "- Expected: /tmp/them-quality-gate-backend.log (non-empty)"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          gate_size=$(wc -c < /tmp/them-quality-gate-backend.log | tr -d ' ')
          echo "Quality gate ran. Evidence: /tmp/them-quality-gate-backend.log (${gate_size} bytes)"

      - name: Release automation summary
        if: always()
        run: |
          {
            echo "## Release Preflight Summary"
            echo
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- RUN_QUALITY_GATE: enforced"
            echo "- Backend/app gate: enforced before iPhone and Mac desktop preflight"
            echo "- Clementine Studio gate: instinct correction changes rescue rank while due canon remains protected on iPhone and macOS"
            echo "- Mac desktop preflight: production scaffold archive"
            echo "- Release-candidate tag convention: \`rc-*\`"
            echo "- Required workflow secrets with current defaults: \`OPENAI_API_KEY\`, \`APP_TOKEN\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-failure-logs
          if-no-files-found: ignore
          path: |
            /tmp/them-quality-gate-backend.log
            /tmp/them_release_preflight_build.log
            /tmp/them-smoke/them-home.png
            /tmp/them-smoke/studio-instinct-writer-block/
