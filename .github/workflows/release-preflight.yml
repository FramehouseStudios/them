name: release-preflight

on:
  push:
    tags:
      - "rc-*"
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true
      APP_TOKEN_RELEASE:
        required: true
      DEVELOPMENT_TEAM_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-structural-canary:
    name: Live Scene Doctor, Feature Architecture, And Continuation Corrections
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require OpenAI Provider Secret
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is required for the live Studio story-quality release canary."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Score Live Story And Correction Quality
        working-directory: backend
        run: npm run eval:live-studio-story-quality

  release-preflight:
    name: Release Preflight
    needs: live-structural-canary
    runs-on: macos-latest
    env:
      RUN_QUALITY_GATE: 1
      RUN_SERVER: 1
      RUN_EVAL: 1
      RUN_SPECULATIVE_REUSE_GATE: 1
      RUN_SMOKE: 1
      RUN_TALK_RECOVERY_GATE: 1
      RUN_ALERT: 1
      RUN_LOAD: 0
      RUN_LIVE_STUDIO_STRUCTURAL_CANARY: 0
      RUN_MAC_DESKTOP_PREFLIGHT: 0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_TOKEN_RELEASE: ${{ secrets.APP_TOKEN_RELEASE }}
      APP_TOKEN: ${{ secrets.APP_TOKEN_RELEASE }}
      DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://api.them.io' }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || 'https://them.io/privacy' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          missing=()
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            missing+=("OPENAI_API_KEY")
          fi
          if [[ -z "${APP_TOKEN_RELEASE:-}" ]]; then
            missing+=("APP_TOKEN_RELEASE")
          fi
          if [[ -z "${DEVELOPMENT_TEAM_ID:-}" ]]; then
            missing+=("DEVELOPMENT_TEAM_ID")
          fi
          if (( ${#missing[@]} > 0 )); then
            {
              echo "## Release Preflight Summary"
              echo
              echo "- Trigger: ${{ github.event_name }}"
              echo "- Ref: ${{ github.ref }}"
              echo "- Status: failed before preflight execution"
              echo "- Missing required secrets: ${missing[*]}"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Ensure gate scripts are executable
        run: chmod +x ./scripts/quality_gate.sh ./scripts/appstore_preflight.sh ./scripts/run_release_preflight.sh

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Release Preflight With Quality Gate
        run: bash ./scripts/run_release_preflight.sh

      - name: Upload Clementine Studio Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clementine-studio-writer-block-evidence
          if-no-files-found: warn
          retention-days: 14
          path: /tmp/them-smoke/studio-instinct-writer-block/

      - name: Verify Quality Gate Was Enforced
        run: |
          if [[ "${RUN_QUALITY_GATE:-}" != "1" ]]; then
            {
              echo "::error::RUN_QUALITY_GATE=${RUN_QUALITY_GATE:-unset}. Release preflight requires the quality gate to be enforced. The workflow's env: block must keep RUN_QUALITY_GATE=1 for every release-candidate run."
              echo
              echo "## Release Preflight Summary"
              echo
              echo "- Status: failed — quality gate was not enforced"
              echo "- RUN_QUALITY_GATE: ${RUN_QUALITY_GATE:-unset}"
              echo "- Required: 1"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ ! -s /tmp/them-quality-gate-backend.log ]]; then
            {
              echo "::error::Expected quality gate evidence at /tmp/them-quality-gate-backend.log was not produced or is empty. The gate may have been skipped despite RUN_QUALITY_GATE=1."
              echo
              echo "## Release Preflight Summary"
              echo
              echo "- Status: failed — quality gate evidence missing"
              echo "- Expected: /tmp/them-quality-gate-backend.log (non-empty)"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          gate_size=$(wc -c < /tmp/them-quality-gate-backend.log | tr -d ' ')
          echo "Quality gate ran. Evidence: /tmp/them-quality-gate-backend.log (${gate_size} bytes)"

      - name: Release automation summary
        if: always()
        run: |
          {
            echo "## Release Preflight Summary"
            echo
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- RUN_QUALITY_GATE: enforced"
            echo "- Backend/app gate: enforced before iPhone release preflight"
            echo "- Clementine quality gate: every rescue proves playable specificity, causal advancement, character cost, and correct act progression"
            echo "- Live structural canary: Scene Doctor and feature architecture pass canon continuity, act causality, character arc, and payoff quality"
            echo "- Clementine Studio gate: instinct correction changes rescue rank while due canon remains protected"
            echo "- Platform posture: iPhone-only V1; Mac scaffold is outside this release gate"
            echo "- Release-candidate tag convention: \`rc-*\`"
            echo "- Required workflow secrets: \`OPENAI_API_KEY\`, \`APP_TOKEN_RELEASE\`, \`DEVELOPMENT_TEAM_ID\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-failure-logs
          if-no-files-found: ignore
          path: |
            /tmp/them-quality-gate-backend.log
            /tmp/them_release_preflight_build.log
            /tmp/them-smoke/them-home.png
            /tmp/them-smoke/studio-instinct-writer-block/
