# Keep THEM's backend, container, and CI dependencies visible and reviewable.
# Major runtime/framework upgrades stay isolated; patch/minor npm updates are
# grouped by production impact. Security updates are not suppressed by the
# version-update ignores below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      backend-production-patch-minor:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: ["minor", "patch"]
      backend-development-patch-minor:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "backend-only", "tier-2"]
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels: ["dependencies", "tier-2"]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels: ["dependencies", "backend-only", "tier-2"]
    commit-message:
      prefix: "deps(docker)"
