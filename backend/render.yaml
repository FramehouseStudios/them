# Render Blueprint for the io.them backend.
#
# This file is one valid deploy target. The Dockerfile is host-agnostic, so the
# same image runs on Fly, ECS, Cloud Run, or Kubernetes if Render is replaced.
# See backend/DEPLOY.md for the full deploy recipe.
#
# Apply with: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: them-backend
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    # Blueprint paths resolve from the repository root, even though this file
    # lives under backend/.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render runs this from the built image on separate compute before the new
    # version can receive traffic. It applies every SQL migration, then fails
    # closed unless the canonical auth store is already initialized or this is
    # the explicitly confirmed first empty production database.
    preDeployCommand: node /app/ops/render_predeploy.mjs
    healthCheckPath: /healthz
    autoDeploy: false  # require explicit promotion; CI runs the quality gate
    # V1 auth writes serialize in-process; horizontal scale is not safe yet.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Link Postgres through Render's private network. Do not paste or commit a
      # generated connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: them-postgres
          property: connectionString
      # Render owns this backend-only signing secret. APP_TOKEN remains a
      # dashboard prompt because the signed app must use the same value.
      - key: JWT_SECRET
        generateValue: true
      # Secrets — set these in the Render dashboard, NOT in this file.
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: AUTH_APPLE_AUDIENCE
        sync: false
      # First deploy only: enter `initialize-empty-canonical-auth-store-v1` after
      # verifying this database contains no real users, then remove the value
      # after the first healthy deploy. Existing valid markers need no value.
      - key: AUTH_STORE_EMPTY_INIT_CONFIRMATION
        sync: false
      # App Store Server API (IAP verify). Required to credit packs; omit → fail closed.
      - key: APP_STORE_ISSUER_ID
        sync: false
      - key: APP_STORE_KEY_ID
        sync: false
      - key: APP_STORE_PRIVATE_KEY
        sync: false
      - key: APP_STORE_BUNDLE_ID
        sync: false
      - key: APP_STORE_ENVIRONMENT
        sync: false
      # Optional tuning — safe defaults; override in dashboard if needed.
      - key: CORS_ALLOW_ORIGIN
        value: ""
      - key: API_SCHEMA_VERSION
        value: "1"
      - key: REQUIRE_USER_AUTH
        value: "true"
      - key: AUTH_REQUIRE_EMAIL_VERIFIED
        value: "false"
      - key: SHUTDOWN_GRACE_MS
        value: "25000"
      - key: CHAT_STRUCTURAL_REASONING_ENABLED
        value: "true"
      - key: CHAT_MODEL_STRUCTURAL
        value: "gpt-5.6-sol"
      - key: CHAT_MODEL_STRUCTURAL_FALLBACK
        value: "gpt-4o"
      # Muse Spark brain (D008). Read only when CLEMENTINE_MUSE_ENABLED=1 and a
      # MODEL_API_KEY/MUSE_API_KEY is set in the dashboard. Change this value to
      # trial a newer model (e.g. muse-spark-1.3) without a code change; D008
      # requires the companion golden-set eval before promoting a new default.
      - key: MUSE_MODEL
        value: "muse-spark-1.2"
      - key: CHAT_STRUCTURAL_REASONING_EFFORT
        value: "medium"
      - key: CHAT_SCREENPLAY_REPAIR_REASONING_EFFORT
        value: "high"
      - key: STRUCTURAL_TURN_SYSTEM_PROMPT_MAX_CHARS
        value: "10000"
      - key: CLEMENTINE_PAGE_MULTIPASS
        value: "0"
      - key: PAGE_MULTIPASS_REPAIR
        value: "0"

  - type: web
    name: them-public
    runtime: static
    buildCommand: test -f site/index.html && test -f site/privacy/index.html
    staticPublishPath: ./site
    autoDeploy: false  # publish only after the release gate is green
    domains:
      - them.io
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), geolocation=(), microphone=()"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: them-postgres
    databaseName: them
    user: them
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
