# Render Blueprint for the io.them backend.
#
# This file is one valid deploy target. The Dockerfile is host-agnostic, so the
# same image runs on Fly, ECS, Cloud Run, or Kubernetes if Render is replaced.
# See backend/DEPLOY.md for the full deploy recipe.
#
# Apply with: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: them-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false  # require explicit promotion; CI runs the quality gate
    # Apply pending DB migrations before the new image serves traffic. The
    # runner is idempotent + atomic (each migration's DDL and its tracking row
    # commit in one transaction) and takes a Postgres advisory lock so two
    # instances can't migrate concurrently. Any failure exits non-zero and
    # fails the deploy, so code never ships ahead of its schema.
    preDeployCommand: npm run migrate && npm run preflight:release
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Secrets — set these in the Render dashboard, NOT in this file.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: AUTH_APPLE_AUDIENCE
        sync: false
      # Optional tuning — safe defaults; override in dashboard if needed.
      - key: CORS_ALLOW_ORIGIN
        value: ""
      - key: API_SCHEMA_VERSION
        value: "1"
      - key: REQUIRE_USER_AUTH
        value: "true"
      - key: AUTH_REQUIRE_EMAIL_VERIFIED
        value: "false"

databases:
  - name: them-postgres
    databaseName: them
    user: them
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
